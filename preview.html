<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epic E1000 GX Checklist Preview</title>
    <style>
        body {
            font-family: sans-serif;
            line-height: 1.2;
            margin: 0;
            padding: 20px;
        }
        @media print {
            /* Reset all elements */
            * {
                box-shadow: none !important;
                -webkit-box-shadow: none !important;
                -moz-box-shadow: none !important;
                text-shadow: none !important;
            }
            
            body {
                padding: 0 !important;
                margin: 0 !important;
            }
            
            #content {
                display: block !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            
            .page {
                position: relative !important;
                width: 100% !important;
                height: auto !important;
                min-height: initial !important;
                margin: 0 !important;
                padding: 0.25in !important;
                page-break-after: always !important;
                column-count: 3 !important;
                column-gap: 10px !important;
                column-fill: balance !important;
                overflow: visible !important;
            }
            
            #page-front {
                page-break-after: always !important;
            }
            
            #page-back {
                page-break-after: avoid !important;
            }
            
            /* Hide non-checklist elements */
            .page-controls,
            .page-label {
                display: none !important;
                visibility: hidden !important;
            }
            
            .checklist-column {
                border: 1px solid #000 !important;
                margin-bottom: 8px !important;
                break-inside: avoid-column !important;
                page-break-inside: avoid !important;
            }
            
            .checklist-title {
                border-bottom: 1px solid #000 !important;
                background-color: #00bfff !important;
            }                   
            
            /* Ensure columns print correctly */
            @page {
                size: landscape !important;
                margin: 0.25in !important;
            }
        }
        #content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        .page {
            width: 11in;
            height: 8.5in;
            padding: 0.25in;
            box-sizing: border-box;
            column-count: 3;
            column-gap: 10px;
            column-fill: auto;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            position: relative;
        }
        .page-label {
            position: absolute;
            top: 0.1in;
            left: 0;
            right: 0;
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            color: #666;
            z-index: 10;
        }
        .page-controls {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 10px;
            z-index: 1000;
            padding: 5px;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .page-controls button {
            padding: 5px 10px;
            cursor: pointer;
        }
        @media print {
            .page-controls {
                display: none;
            }
        }
        .checklist-column {
            border: 2px solid #000;
            margin-bottom: 10px;
            break-inside: avoid-column;
            page-break-inside: avoid;
            display: inline-block;
            width: 100%;
        }
        .checklist-title {
            background-color: #00bfff;
            color: black;
            font-weight: bold;
            text-align: center;
            padding: 4px 0;
            margin: 0;
            border-bottom: 1px solid #000;
        }
        .section-title {
            padding: 2px 4px;
            margin: 0;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #000;
        }
        .checklist-item {
            display: flex;
            padding: 2px 5px;
            font-size: 13px;
            line-height: 1.3;
            position: relative;
            overflow: visible;
        }
        .item-text {
            padding-right: 6px;
            position: relative;
            z-index: 2;
        }
        .item-response {
            padding-left: 6px;
            margin-left: auto;
            text-align: right;
            font-weight: bold;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
        }
        .leader-dots {
            flex: 1;
            height: 1em;
            margin: 0 2px;
            align-self: flex-end;
            position: relative;
        }
        .leader-dots::after {
            content: "";
            position: absolute;
            bottom: 0.3em;
            left: 0;
            right: 0;
            height: 1px;
            background-image: url('dot-pattern.svg');
            background-repeat: repeat-x;
        }
        .metadata {
            background-color: #f8f8f8;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            max-width: 600px;
            margin: 0 auto 20px auto;
        }
        .challenge { font-weight: normal; }
        .memoryItem { color: #800080; }
        .warning { color: #ff0000; }
        .caution { color: #bc5100; }
        .note { color: hsl(247, 100%, 35%); font-style: italic; }
        .subtitle { color: #007700; }
    </style>
</head>
<body>
    <div id="content"></div>
    <div class="page-controls">
        <button id="printBtn">Print Checklist</button>
    </div>

    <script>
        // Load the checklist data
        fetch('checklist-short.json')
            .then(response => response.json())
            .then(data => {
                displayChecklists(data);
                setupControls();
            })
            .catch(error => {
                console.error('Error loading checklist data:', error);
                document.getElementById('content').innerHTML = 
                    '<p>Error loading checklist data. Please check the console for details.</p>';
            });

        function displayChecklists(data) {
            const contentDiv = document.getElementById('content');
            let html = '';
            
            // Create front and back pages
            let frontPageHtml = '<div class="page page-front" id="page-front">';
            let backPageHtml = '<div class="page page-back" id="page-back">';
            
            // Process checklists by page number
            const page1Checklists = [];
            const page2Checklists = [];
            
            // For each group of checklists
            data.groups.forEach(group => {
                // Process each checklist
                group.checklists.forEach(checklist => {
                    let checklistHtml = '';
                    checklistHtml += `<div class="checklist-column">`;
                    checklistHtml += `<h4 class="checklist-title">${checklist.name}</h4>`;
                    
                    // For each entry in the checklist
                    checklist.entries.forEach(entry => {
                        const entryClass = entry.type.toLowerCase();
                        const response = entry.response || '';
                        
                        // Handle section titles differently
                        if (entry.type === 'Subtitle' && !response) {
                            checklistHtml += `<h4 class="section-title">${entry.text}</h4>`;
                        } else if (entry.type === 'Note' || entry.type === 'Warning' || entry.type === 'Caution') {
                            checklistHtml += `<div class="checklist-item ${entryClass}">`;
                            checklistHtml += `<div class="item-text" style="flex: 1">${entry.text}</div>`;
                            checklistHtml += `</div>`;
                        } else {
                            checklistHtml += `<div class="checklist-item ${entryClass}">`;
                            checklistHtml += `<div class="item-text">${entry.text}</div>`;
                            checklistHtml += `<div class="leader-dots"></div>`;
                            checklistHtml += `<div class="item-response">${response}</div>`;
                            checklistHtml += `</div>`;
                        }
                    });
                    
                    checklistHtml += '</div>'; // Close checklist column
                    
                    // Add to appropriate page based on the page property
                    if (checklist.page === 2) {
                        page2Checklists.push(checklistHtml);
                    } else {
                        // Default to page 1 if not specified
                        page1Checklists.push(checklistHtml);
                    }
                });
            });
            
            // Add all page 1 checklists to the front page
            page1Checklists.forEach(checklistHtml => {
                frontPageHtml += checklistHtml;
            });
            
            // Add all page 2 checklists to the back page
            page2Checklists.forEach(checklistHtml => {
                backPageHtml += checklistHtml;
            });
            
            // Close both pages
            frontPageHtml += '</div>';
            backPageHtml += '</div>';
            
            // Add both pages to the HTML content
            html = frontPageHtml + backPageHtml;
            
            // Set the content
            contentDiv.innerHTML = html;
        }
        
        function setupControls() {
            // Print button functionality
            document.getElementById('printBtn').addEventListener('click', function() {
                window.print();
            });
            
            // Add page labels
            const frontPage = document.getElementById('page-front');
            const backPage = document.getElementById('page-back');
            
            // Insert page labels at the top of each page
            frontPage.insertAdjacentHTML('afterbegin', '<div class="page-label">FRONT PAGE</div>');
            backPage.insertAdjacentHTML('afterbegin', '<div class="page-label">BACK PAGE</div>');
        }
    </script>
</body>
</html>
